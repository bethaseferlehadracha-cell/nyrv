*{box-sizing:border-box;margin:0;padding:0}

button:disabled{cursor:not-allowed}

.sky{position:fixed;inset:0;z-index:0;pointer-events:none;

20r%3D%220.9%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.9%22/%3E%3Ccircle%20cx%3D%22607%22%20cy%3D%22262%22%20r%3D%221.1%22%20fill%3D%22%23fff3df%22%20opacity%3D%220.67%22/%3E%3Ccircle%20cx%3D%221345%22%20cy%3D%2239%22%20r%3D%221.6%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.28%22/%3E%3Ccircle%20cx%3D%221114%22%20cy%3D%22354%22%20r%3D%221.1%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.58%22/%3E%3Ccircle%20cx%3D%22979%22%20cy%3D%22513%22%20r%3D%220.7%22%20fill%3D%22%23dfe6ff%22%20opacity%3D%220.61%22/%3E%3C/svg%3E") center/cover no-repeat;opacity:calc(1 - var(--dawn)*.85);transition:opacity 2s}
.twinkle{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:calc(1 - var(--dawn))}
.twinkle i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 3.2s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.dawn{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--dawn);transition:opacity 2.5s;
  background:
   radial-gradient(1200px 520px at 50% 118%, rgba(255,170,140,.55), transparent 70%),
   radial-gradient(900px 380px at 50% 105%, rgba(255,214,170,.45), transparent 70%),
   linear-gradient(180deg,#141a2e 0%,#2c3354 45%,#7b6a86 80%,#d9a08f 100%);}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 36px;
  background:linear-gradient(180deg,rgba(6,7,12,.92),rgba(6,7,12,.55));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3);margin-top:1px}
.code{display:flex;gap:7px;transition:filter .6s,opacity .6s}
.code span{width:34px;height:42px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:20px;color:rgba(255,255,255,.13);background:rgba(255,255,255,.02);transition:all .5s}
.code span.lit{color:var(--n1);background:var(--acc);border-color:var(--acc);box-shadow:0 0 22px rgba(207,216,232,.3)}
.code span.pulse{animation:pulse .9s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.code .gap{width:8px;border:none;background:none}
.clock{text-align:left;direction:ltr;min-width:120px}
.clock b{font-family:HeeboL,Heebo;font-weight:700;font-size:30px;letter-spacing:2px;font-variant-numeric:tabular-nums;color:var(--acc);text-shadow:0 0 18px rgba(207,216,232,.25)}
.clock small{display:block;direction:rtl;text-align:left;font-size:12px;color:var(--ink3)}
.prog{position:absolute;bottom:-1px;right:0;height:2px;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:width .8s ease}
body.blind .code{filter:blur(2px);opacity:.25}
body.blind .clock b{color:var(--ink3);text-shadow:none}
body.intro .hud{opacity:0;pointer-events:none}

/* ---------- stage ---------- */
#stage{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;padding:96px 40px 0}
.scene{flex:1;display:flex;flex-direction:column;animation:sceneIn .7s ease both}
@keyframes sceneIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chap{font-size:14px;font-weight:500;color:var(--acc);margin-bottom:8px}
.chap b{font-weight:800}
h1.ttl{font-size:clamp(26px,3.2vw,40px);font-weight:800;line-height:1.2;margin-bottom:10px}
.lead{font-size:clamp(16px,1.5vw,19px);line-height:1.65;color:var(--ink2);font-weight:500;max-width:760px}
.lead b{color:var(--ink)}

.split{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:stretch}
.main{padding:18px 0 44px;display:flex;flex-direction:column;gap:18px;min-width:0}
.noy-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:sticky;bottom:0;align-self:end;max-height:calc(100vh - 96px)}
.bubble{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:15px 18px;font-size:16.5px;font-weight:500;line-height:1.55;box-shadow:0 14px 40px rgba(0,0,0,.4);margin-bottom:14px;width:100%}
.bubble b{font-weight:800}
.bubble:after{content:"";position:absolute;bottom:-13px;left:50%;border:14px solid transparent;border-top-color:var(--paper);border-bottom:0;transform:translateX(-50%)}
.bubble.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.fig{height:min(54vh,470px);width:auto;display:block;filter:drop-shadow(0 0 1.5px rgba(207,216,232,.45)) drop-shadow(0 30px 40px rgba(0,0,0,.55));transition:opacity .14s,transform .3s}
.fig.swap{opacity:0;transform:translateY(6px)}
.np{position:absolute;bottom:18px;padding:7px 16px;border-radius:11px;background:rgba(8,9,12,.85);border:1px solid rgba(255,255,255,.12);text-align:center;font-size:12px;color:var(--ink2)}
.np b{display:block;color:var(--ink);font-size:14px}

/* ---------- ui ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;backdrop-filter:blur(10px)}
.card h3{font-size:19px;font-weight:800;margin-bottom:8px}
.card p{font-size:16px;line-height:1.65;color:var(--ink2);font-weight:500}
.card p b{color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:14px 30px;border-radius:14px;border:none;background:var(--acc);color:var(--n1);font-weight:800;font-size:17px;box-shadow:0 10px 30px rgba(207,216,232,.18);transition:transform .15s,opacity .2s}
.btn:hover{transform:translateY(-2px)}
.btn:focus{outline:none}.btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.btn:disabled{opacity:.3;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.22);box-shadow:none}
.q{font-size:18px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:right;padding:14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-size:16.5px;font-weight:500;display:flex;align-items:center;gap:12px;transition:all .2s;line-height:1.4}
.opt i{font-style:normal;flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:800;font-size:14px;color:var(--ink2)}
.opt:hover:not(:disabled){border-color:var(--acc);background:rgba(207,216,232,.06)}
.opt.ok{border-color:var(--ok);background:rgba(143,214,176,.12)}
.opt.ok i{background:var(--ok);color:var(--n1)}
.opt.bad{border-color:var(--bad);background:rgba(255,143,143,.08);animation:shake .4s}
.opt.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{font-size:16px;line-height:1.6;padding:14px 18px;border-radius:14px;border-right:4px solid var(--ok);background:rgba(143,214,176,.08)}
.fb.bad{border-color:var(--bad);background:rgba(255,143,143,.07)}
.quote{font-size:clamp(20px,2vw,26px);font-weight:700;line-height:1.4;padding:14px 20px;border-radius:12px}
.quote.broken{background:rgba(255,90,90,.07);border-right:4px solid #ff6b6b}
.quote.fixed{background:rgba(143,214,176,.08);border-right:4px solid var(--ok)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--ink2);margin-bottom:6px}
.hidden{display:none!important}
.fade{animation:sceneIn .5s ease both}

/* ---------- opening ---------- */
.open{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 0 140px;position:relative}
.open .eyebrow{font-size:15px;font-weight:500;color:var(--acc);margin-bottom:16px}
.open h1{font-size:clamp(64px,10vw,140px);font-weight:900;line-height:.95;letter-spacing:-2px}
.open h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--ink)}
.open .sub{max-width:580px;margin:24px auto 0;font-size:clamp(17px,1.6vw,20px);line-height:1.6;color:var(--ink2)}
.who{margin-top:34px;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink2);justify-content:center;flex-wrap:wrap}
.pill{padding:10px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:16px;background:transparent}
.pill.sel{background:var(--ink);color:var(--n1);border-color:var(--ink)}
.open .btn{margin-top:28px;font-size:19px;padding:16px 46px}
.moon{position:fixed;top:118px;left:13%;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbf8f0,#e5e2da 60%,#b9b6ae);box-shadow:0 0 90px rgba(230,235,255,.28);z-index:1;transition:all 2s}
.horizon{position:fixed;bottom:0;left:0;right:0;height:220px;z-index:1;pointer-events:none}
.notif{position:fixed;z-index:6;bottom:40px;left:40px;width:350px;padding:15px 18px;border-radius:18px;background:rgba(18,19,24,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:right;animation:notif 1s 1.2s cubic-bezier(.2,1.2,.4,1) both}
@keyframes notif{from{transform:translateY(140%);opacity:0}to{transform:none;opacity:1}}
.notif .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:6px}
.notif .top b{color:var(--ink);font-size:13px}
.notif p{font-size:15px;line-height:1.5}
.resume{margin-top:18px;font-size:14px;color:var(--ink3)}
.resume button{background:none;border:none;color:var(--acc);text-decoration:underline;font-size:14px;margin:0 6px}

/* ---------- march ---------- */
.march{position:fixed;inset:0;z-index:1}
.march svg{position:absolute;inset:0;width:100%;height:100%}
.march .layer{transition:transform 1.2s ease}
.fog{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(800px 260px at 30% 62%,rgba(190,195,210,.13),transparent 70%),radial-gradient(900px 300px at 75% 70%,rgba(190,195,210,.10),transparent 70%),linear-gradient(180deg,transparent 30%,rgba(160,165,180,.12) 60%,rgba(2,3,5,.7));animation:fogmove 14s ease-in-out infinite alternate}
@keyframes fogmove{to{transform:translateX(-40px)}}
.tzone{position:relative;flex:1;min-height:260px;margin-top:14px;transition:opacity .8s}
.tzone.dim{opacity:.22}
.tzone .thought{max-width:46%}
@media (max-width:900px){.tzone{min-height:330px}.tzone .thought{font-size:15px;padding:9px 14px}.tzone.dim{display:none}}
.thought{position:absolute;padding:11px 20px;border-radius:22px;background:rgba(30,33,44,.85);border:1px solid rgba(207,216,232,.3);font-size:clamp(15px,1.5vw,19px);font-weight:600;color:#fff;backdrop-filter:blur(6px);animation:thought .9s ease both}
@keyframes thought{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.mscene{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:36px;gap:18px}
@media (max-width:900px){.mscene{justify-content:flex-start;padding-top:6px}.mscene>*{order:2}.mscene>.chap{order:0}.mscene>.mp-wrap{order:1}.mscene .narr{margin-top:auto}}
.mbottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.narr p{font-size:clamp(19px,2vw,25px);line-height:1.55;font-weight:500;max-width:640px}
.narr p span{color:var(--ink3)}
.walk{display:flex;flex-direction:column;align-items:center;gap:8px}
.walk small{color:var(--ink3);font-size:13px}
.mp-wrap{position:fixed;left:3%;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;animation:sceneIn .8s ease both}
.mp-wrap img{height:min(56vh,480px);filter:drop-shadow(0 0 1.5px rgba(207,216,232,.4)) drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.mp-wrap .bubble{max-width:330px;margin-bottom:12px}
.mp-wrap .np{bottom:16px}
.overlay{position:relative;z-index:6;max-width:640px}

/* ---------- flip cards ---------- */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.flip{perspective:1000px;height:230px;border:none;background:none;padding:0;text-align:right}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;padding:22px;display:flex;flex-direction:column;border:1px solid var(--line)}
.flip .f{background:linear-gradient(160deg,#1b1e28,#11131a);justify-content:space-between}
.flip .f .n{font-size:13px;color:var(--ink3)}
.flip .f h4{font-size:24px;font-weight:800;line-height:1.2}
.flip .f .hint{font-size:13px;color:var(--acc)}
.flip .b{background:var(--paper);color:var(--paper-ink);transform:rotateY(180deg);font-size:15px;line-height:1.55;overflow:auto}
.flip .b h4{font-size:17px;margin-bottom:6px}

/* ---------- matching ---------- */
.match{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.mrow .who{margin:0;justify-content:flex-start;font-size:16px;color:var(--ink);font-weight:500;font-style:italic}
.mrow .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:transparent;font-size:14px;font-weight:600}
.chip.ok{background:var(--ok);color:var(--n1);border-color:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad);animation:shake .4s}

/* ---------- pile ---------- */
.pile{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mat{position:relative;min-height:96px;padding:16px;border-radius:14px;background:#efe9dc;color:#1c2235;font-weight:700;font-size:15.5px;line-height:1.4;border:none;text-align:right;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .25s,box-shadow .25s,opacity .3s}
.mat:before{content:"";position:absolute;top:-6px;left:50%;width:46px;height:14px;background:rgba(207,216,232,.5);transform:translateX(-50%) rotate(-3deg)}
.mat:hover{transform:rotate(0) translateY(-3px)!important}
.mat.sel{outline:3px solid var(--acc);outline-offset:3px;transform:rotate(0) scale(1.03)!important}
.mat.gone{opacity:0;transform:scale(.6)!important;pointer-events:none}
.mat.bad{animation:shake .4s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bin{min-height:150px;border-radius:18px;border:2px dashed rgba(255,255,255,.18);padding:14px;background:rgba(255,255,255,.02);text-align:right;display:flex;flex-direction:column;gap:8px;transition:all .2s}
.bin:hover{border-color:var(--acc)}
.bin h4{font-size:18px;font-weight:800}
.bin h4 small{font-weight:400;font-size:13px;color:var(--ink3);margin-right:6px}
.bin .it{font-size:14px;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.06);animation:sceneIn .4s both}
.goalbar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:rgba(207,216,232,.08);border:1px solid rgba(207,216,232,.3)}
.goalbar b{color:var(--acc);white-space:nowrap}
.goalbar span{font-size:18px;font-weight:700}

/* ---------- route ---------- */
.route{position:relative;height:190px;margin:8px 0}
.route svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;top:50%;transform:translate(50%,-50%);width:min(19%,190px);min-height:84px;border-radius:14px;border:2px dashed rgba(255,255,255,.2);background:rgba(10,11,16,.85);display:grid;place-items:center;text-align:center;padding:10px;font-size:13.5px;line-height:1.35;color:var(--ink3);font-weight:600}
.slot .k{position:absolute;top:-12px;right:50%;transform:translateX(50%);background:var(--n2);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:12px;color:var(--ink2)}
.slot.fill{border-style:solid;border-color:var(--acc);color:var(--ink);animation:pop .4s}
.slot.flag{border-color:rgba(207,216,232,.5)}
.slot.flag.fill{background:rgba(207,216,232,.14)}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{padding:14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:var(--card);font-size:16px;font-weight:600;text-align:right;transition:all .25s}
.gcard:hover:not(:disabled){border-color:var(--acc)}
.gcard.used{opacity:.25}
.gcard.bad{border-color:var(--bad);animation:shake .4s}

/* ---------- ladder ---------- */
.ladder{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:22px;align-items:start}
.floors{display:flex;flex-direction:column;gap:8px;position:relative;padding-right:18px;border-right:3px solid rgba(255,255,255,.1)}
.floor{position:relative;text-align:right;padding:16px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:var(--card);font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center;transition:all .25s}
.floor small{font-size:12px;color:var(--ink3);font-weight:500}
.floor:hover{border-color:var(--acc)}
.floor.seen{border-color:rgba(207,216,232,.4)}
.floor.on{background:rgba(207,216,232,.14);border-color:var(--acc)}
.floor.ok{border-color:var(--ok);background:rgba(143,214,176,.14)}
.floor.bad{border-color:var(--bad);animation:shake .4s}
.car{position:absolute;right:-12px;width:21px;height:21px;border-radius:6px;background:var(--acc);box-shadow:0 0 14px var(--acc);transition:top .5s cubic-bezier(.5,1.4,.5,1)}
.verbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.verbs span{padding:6px 12px;border-radius:99px;background:rgba(207,216,232,.1);border:1px solid rgba(207,216,232,.25);font-size:14px;font-weight:600}
.verbcard{text-align:center;padding:26px;border-radius:20px;background:var(--paper);color:var(--paper-ink)}
.verbcard small{display:block;font-size:13px;color:#5b6276;margin-bottom:6px}
.verbcard b{font-size:44px;font-weight:900}
.meter{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);transition:width .4s}

/* ---------- doors ---------- */
.corridor{display:flex;gap:12px;justify-content:center;align-items:flex-end;padding:6px 4px 0;border-bottom:1px solid var(--line);background:linear-gradient(0deg,rgba(255,255,255,.04),transparent 50%);overflow-x:auto}
.door{position:relative;flex:0 0 auto;width:96px;height:170px;border-radius:52px 52px 6px 6px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#191b22,#0f1015);display:block;transition:background .6s,border-color .6s,box-shadow .6s}
.door .c{position:absolute;left:0;right:0;top:34px;bottom:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.door .n{position:absolute;top:16px;font-family:HeeboL,Heebo;font-size:13px;color:var(--ink3);font-weight:700}
.door .lock{width:20px;opacity:.45}
.door.open{background:linear-gradient(180deg,rgba(207,216,232,.95),rgba(207,216,232,.4));border-color:var(--acc);box-shadow:0 0 34px rgba(207,216,232,.22)}
.door.open .n{color:var(--n1)}
.door .L{font-size:50px;font-weight:900;color:var(--n1);line-height:1}
.door .r{font-size:11px;font-weight:700;color:var(--n1);opacity:.75;text-align:center;padding:0 6px}
.door.active{height:186px;border:2px solid var(--acc);background:linear-gradient(180deg,#1f222b,#14161c);box-shadow:0 0 0 6px rgba(207,216,232,.08)}
.door.active .q{font-size:42px;font-weight:900;color:var(--acc)}
.door.opening{animation:dooropen 1s ease}
@keyframes dooropen{0%{transform:perspective(500px) rotateY(0)}45%{transform:perspective(500px) rotateY(-70deg)}100%{transform:perspective(500px) rotateY(0)}}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rules{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rules div{padding:12px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:13px;color:var(--ink2);line-height:1.35}
.rules b{display:block;font-size:30px;color:var(--acc);font-weight:900}

/* ---------- vault ---------- */
.topics{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--ink2)}
.field label b{color:var(--acc)}
.field textarea{font-family:inherit;font-size:17px;line-height:1.5;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;resize:vertical;min-height:52px;direction:rtl}
.field textarea:focus{outline:none;border-color:var(--acc)}
.checks{display:flex;flex-wrap:wrap;gap:6px;min-height:22px}
.checks span{font-size:12.5px;padding:3px 10px;border-radius:99px;font-weight:600}
.checks .y{background:rgba(143,214,176,.14);color:var(--ok)}
.checks .n{background:rgba(255,143,143,.12);color:var(--bad)}
.checks .w{background:rgba(255,214,140,.12);color:#ffd68c}
.manual{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.manual label{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink2);cursor:pointer}
.manual input{width:18px;height:18px;accent-color:var(--acc)}
.vault{display:grid;place-items:center;padding:10px}
.dial{width:min(300px,70vw);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle,#2a2d36 0 34%,#15171d 35% 62%,#22252e 63% 100%);border:3px solid #3a3e4a;box-shadow:0 0 60px rgba(207,216,232,.12),inset 0 0 30px rgba(0,0,0,.6);transition:transform 2.2s cubic-bezier(.3,1.2,.4,1)}
.dial span{position:absolute;top:50%;left:50%;font-weight:900;font-size:24px;color:var(--ink3);transition:color .4s}
.dial span.lit{color:var(--acc);text-shadow:0 0 12px var(--acc)}
.dial .hub{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a4e5a,#1d1f26);display:grid;place-items:center;font-size:30px}
.dial.spin{transform:rotate(720deg)}
.dial .hub{transition:transform 2.2s cubic-bezier(.3,1.2,.4,1)}
.dial.spin .hub{transform:rotate(-720deg)}
.vault.open .dial{box-shadow:0 0 120px rgba(207,216,232,.5)}

/* ---------- end ---------- */
.end .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:34px;font-weight:900;color:var(--acc);font-family:HeeboL,Heebo}
.stat span{font-size:13px;color:var(--ink2)}
.mygoals li{margin-right:20px;font-size:16px;line-height:1.7}
.sun{position:fixed;bottom:-140px;left:50%;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,#ffe2b8,#ffb98f 50%,transparent 70%);opacity:var(--dawn);z-index:0;filter:blur(4px);transition:opacity 2.5s}

/* ---------- bridge (between pages) ---------- */
.bridge{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(4,5,9,.74);backdrop-filter:blur(9px);animation:sceneIn .45s ease both}
.bridge .bx{width:100%;max-width:560px;background:#12141c;border:1px solid rgba(207,216,232,.25);border-radius:24px;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:16px}
.bridge .bh{font-size:13px;font-weight:700;color:var(--acc)}
.bridge .st{display:flex;gap:14px;align-items:flex-start}
.bridge .st i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:16px}
.bridge .st.d i{background:var(--ok);color:var(--n1)}
.bridge .st.n i{background:var(--acc);color:var(--n1)}
.bridge .st small{display:block;font-size:12.5px;font-weight:700;color:var(--ink3);margin-bottom:2px}
.bridge .st p{font-size:17.5px;line-height:1.55;font-weight:500;color:var(--ink)}
.bridge .sep{height:1px;background:var(--line)}
.bridge .btn{align-self:stretch;margin-top:4px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hud{padding:10px 14px}
  .brand small{display:none}
  .brand{font-size:14px}
  .code{gap:3px}
  .code span{width:22px;height:30px;font-size:14px;border-radius:6px}
  .code .gap{width:4px}
  .clock{min-width:auto}
  .clock b{font-size:20px}
  .clock small{display:none}
  #stage{padding:76px 16px 0}
  .split{display:flex;flex-direction:column;gap:14px;padding:6px 0 40px}
  .split>.main{display:contents}
  .split>.main>*{order:4}
  .split>.main>.chap{order:0;margin:0}
  .split>.main>.ttl{order:1;margin:0}
  .split>.main>.lead{order:2}
  .noy-col,.mp-wrap{order:3;position:relative;display:flex;flex-direction:row;align-items:flex-end;gap:8px;max-height:none;align-self:stretch;margin:0;padding:12px 10px 0 12px;border-radius:20px;background:linear-gradient(180deg,rgba(207,216,232,.08),rgba(207,216,232,.02));border:1px solid rgba(207,216,232,.16);overflow:hidden;left:auto;bottom:auto}
  .noy-col .fig,.mp-wrap img{order:0;flex:none;height:178px;width:auto;max-width:44%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 1px rgba(207,216,232,.4))}
  .noy-col .bubble,.mp-wrap .bubble{order:1;flex:1;align-self:center;margin:0 0 12px;font-size:15px;padding:12px 14px;max-width:none}
  .noy-col .bubble:after,.mp-wrap .bubble:after{display:block;left:auto;right:-10px;top:50%;bottom:auto;border:10px solid transparent;border-left-color:var(--paper);border-right:0;transform:translateY(-50%)}
  .noy-col .np,.mp-wrap .np{display:none}
  .bridge .bx{padding:22px 18px 18px}
  .bridge .st p{font-size:16px}
  .opts,.goals,.ba,.bins,.manual{grid-template-columns:1fr}
  .flips{grid-template-columns:1fr}
  .flip{height:190px}
  .pile{grid-template-columns:1fr 1fr}
  .ladder{grid-template-columns:1fr}
  .rules{grid-template-columns:repeat(4,1fr)}
  .corridor{justify-content:flex-start;gap:5px;padding:4px 0 0}
  .door{width:calc((100% - 30px)/7);min-width:38px;height:108px;border-radius:30px 30px 5px 5px}
  .door.active{height:118px}
  .door .c{top:26px}
  .door .n{top:10px;font-size:11px}
  .door .L{font-size:26px}
  .door.active .q{font-size:28px}
  .door .lock{width:14px}
  .door .r{display:none}
  .route{height:auto;display:flex;flex-direction:column;gap:10px}
  .route svg{display:none}
  .slot{position:relative;top:auto;right:auto!important;transform:none;width:100%;min-height:56px}
  .notif{left:16px;right:16px;width:auto;bottom:16px}
  .moon{left:8%;top:84px;width:54px;height:54px}
  .open{padding-bottom:160px}
  .end .stats{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr}
}
/* ===================== v3 additions ===================== */
.hud{gap:14px;padding:12px 28px}
.back{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;border:1px solid rgba(207,216,232,.28);background:rgba(207,216,232,.06);font-weight:700;font-size:14px;color:var(--ink)}
.back:disabled{opacity:.25}
.loc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.loc b{font-size:13px;color:var(--acc);font-weight:700}
.loc span{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.loc .dots{display:flex;gap:5px;margin-top:6px}
.loc .dots i{width:22px;height:4px;border-radius:3px;background:rgba(255,255,255,.14);transition:all .4s}
.loc .dots i.d{background:rgba(207,216,232,.6)}
.loc .dots i.c{background:var(--acc);box-shadow:0 0 8px var(--acc)}
#stage{padding-top:96px}
.open h1{margin-bottom:8px}
.resumebox{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:12px}
.resumebox small{font-size:14px;color:var(--ink3)}
.btn.big{font-size:19px;padding:16px 40px}
/* whatsapp */
.wa{width:100%;max-width:440px;margin:4px auto 0;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.55);background:#0b141a;display:flex;flex-direction:column}
.wa-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1f2c34}
.wa-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#55704a,#2c3d29);display:grid;place-items:center;font-weight:800;font-size:14px;color:#e9edef;flex:none}
.wa-h b{display:block;font-size:16px;color:#e9edef}
.wa-h small{font-size:12.5px;color:#8696a0}
.wa-body{min-height:340px;padding:16px 14px 12px;display:flex;flex-direction:column;gap:6px;background:#0b141a radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/18px 18px}
.wa-day{align-self:center;font-size:12px;color:#8696a0;background:#182229;padding:4px 12px;border-radius:8px;margin-bottom:6px}
.wa-m{max-width:84%;padding:8px 12px 5px;border-radius:12px;font-size:16.5px;line-height:1.45;color:#e9edef;animation:pop .35s ease}
.wa-m.in{align-self:flex-start;background:#202c33;border-top-right-radius:4px}
.wa-m.out{align-self:flex-end;background:#005c4b;border-top-left-radius:4px}
.wa-m time{display:block;text-align:left;font-size:11px;color:#8696a0;margin-top:2px;direction:ltr}
.wa-m.out time{color:#a6d3c9}
.wa-m.out time:after{content:" ✓✓";color:#53bdeb}
.wa-typing{align-self:flex-start;background:#202c33;border-radius:12px;padding:11px 14px;display:flex;gap:4px}
.wa-typing i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:dot 1s infinite}
.wa-typing i:nth-child(2){animation-delay:.15s}.wa-typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.wa-f{padding:10px 12px;background:#1f2c34;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:62px;align-items:center}
.wa-f .chip{border-color:#00a884;color:#e9edef;background:#005c4b;font-size:15px;padding:9px 16px}
.wa-f small{color:#8696a0;font-size:13px}
/* floating noy */
.fnoy{position:fixed;left:12px;right:12px;bottom:12px;z-index:55;display:flex;align-items:flex-end;gap:8px;padding:10px 12px 0;border-radius:20px;background:rgba(14,16,24,.97);border:1px solid rgba(207,216,232,.35);box-shadow:0 20px 50px rgba(0,0,0,.6);transform:translateY(140%);transition:transform .35s cubic-bezier(.2,1.2,.4,1);max-width:560px;margin:0 auto;cursor:pointer}
.fnoy{visibility:hidden}
.fnoy.show{transform:none;visibility:visible}
.fnoy img{height:112px;width:auto;flex:none}
.fnoy .bubble{margin:0 0 12px;font-size:15px;padding:10px 12px;flex:1;cursor:pointer}
.fnoy .bubble:after{display:none}
.fnoy .x{position:absolute;top:4px;left:10px;font-size:20px;color:var(--ink3)}
/* bins on top */
.bins.top{position:sticky;top:88px;z-index:6;padding:10px;border-radius:18px;background:rgba(9,10,16,.92);backdrop-filter:blur(8px);border:1px solid var(--line)}
.bins.top .bin{min-height:auto;padding:12px 14px;gap:6px}
.bins.top .bin h4{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bin .cnt{font-family:HeeboL,Heebo;font-size:14px;font-weight:800;background:rgba(207,216,232,.14);border-radius:99px;padding:1px 10px}
.bin .its{display:flex;flex-wrap:wrap;gap:5px}
.bin .its .it{font-size:12.5px;padding:4px 9px}
.bin.flash{border-color:var(--ok);background:rgba(143,214,176,.1)}
/* ladder accordion */
.acc{display:flex;flex-direction:column;gap:8px;max-width:780px}
.acc .floor{width:100%}
.floor .arr{display:inline-block;font-size:13px;color:var(--ink3);transition:transform .3s;margin-right:10px}
.floor.on .arr{transform:rotate(180deg)}
.fdet{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.fdet>div{overflow:hidden}
.fdet.open{grid-template-rows:1fr}
.fdet .inner{padding:14px 18px 18px;margin:-6px 0 4px;border-radius:0 0 14px 14px;background:rgba(207,216,232,.06);border:1px solid rgba(207,216,232,.22);border-top:none}
.fdet p{font-size:16px;line-height:1.65;color:var(--ink2);font-weight:500}
.vlabel{display:block;margin-top:12px;font-size:14px;font-weight:800;color:var(--acc)}
/* practice */
.practice{display:flex;flex-direction:column;gap:12px;max-width:780px}
.practice .floors{padding-right:0;border-right:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.practice .floor{font-size:17px}
.verbcard b{font-size:clamp(21px,2.4vw,30px);line-height:1.4;display:block;font-weight:800}
.verbcard b u{text-decoration:none;background:linear-gradient(0deg,rgba(20,32,58,.18) 38%,transparent 38%)}
/* old-file strip */
.rstrip{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.rstrip span{width:46px;height:56px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:24px;color:rgba(255,255,255,.16);background:rgba(255,255,255,.02);transition:all .5s;position:relative}
.rstrip span small{position:absolute;top:3px;right:6px;font-size:10px;color:var(--ink3);font-weight:700}
.rstrip span.lit{color:var(--n1);background:var(--acc);border-color:var(--acc);box-shadow:0 0 18px rgba(207,216,232,.3)}
.rstrip span.lit small{color:var(--n1)}
.rstrip span.cur{border:2px solid var(--acc);color:var(--acc)}
.rstrip .gap{width:10px;border:none;background:none}
.rstrip span.pulse{animation:pulse .9s ease}
/* folder */
.folder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.folder div{padding:14px;border-radius:14px;background:var(--card);border:1px solid rgba(143,214,176,.35);font-size:15px;font-weight:600;animation:pop .5s both}
.folder div b{display:block;color:var(--ok);font-size:13px;margin-bottom:3px}
/* finish */
.finish{max-width:860px;margin:0 auto;width:100%;align-items:center;text-align:center;padding-bottom:50px}
.finish .badge{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:52px;font-weight:900;background:var(--ok);color:var(--n1);box-shadow:0 0 70px rgba(143,214,176,.5);margin:6px auto 4px;animation:pop .7s ease}
.finish h1{font-size:clamp(36px,5.5vw,62px);font-weight:900;line-height:1.1}
.finish .card{text-align:right;width:100%}
.finish .stats{width:100%}
.learned{margin-top:6px}
.learned li{margin-right:22px;font-size:16px;line-height:1.8;color:var(--ink2);font-weight:500}
@media (max-width:900px){
  .hud{padding:9px 12px;gap:8px}
  .back{padding:8px 10px;font-size:13px}
  .loc b{font-size:11.5px}.loc span{font-size:14.5px}
  .loc .dots i{width:14px}
  #stage{padding-top:86px}
  .bins.top{top:80px;grid-template-columns:1fr 1fr}
  .practice .floors{grid-template-columns:1fr 1fr}
  .practice .floor{font-size:15px;padding:13px 12px}
  .folder{grid-template-columns:1fr 1fr}
  .rstrip{gap:5px}
  .rstrip span{width:38px;height:48px;font-size:20px}
  .rstrip .gap{width:4px}
  .wa-body{min-height:300px}
}

</style>
</head>

const P={welcome:'p8',explain:'p1',think:'p3',point:'p2',present:'p5',tablet:'p7',oops:'p6',thumbs:'p4'};
const LETTERS=['כ','ת','ב','א','ח','ר','ת'];
const KEY='lomda-matarot-laila-v3';
const fresh=g=>({g,i:0,letters:[0,0,0,0,0,0,0],first:0,total:0,goals:null,topic:null,sc:{}});

/* ================= state ================= */
let S=fresh(null);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.i==='number'){s.sc=s.sc||{};return s}}catch(e){}return null}
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const t=s=>String(s).replace(/\{([^|{}]*)\|([^|{}]*)\}/g,(_,m,f)=>S.g==='f'?f:m);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ABC=['א','ב','ג','ד','ה','ו'];
let qn=0;
function score(first){const k=S.i+':'+(qn++);if(S.sc[k])return;S.sc[k]=1;S.total++;if(first)S.first++;save()}

/* ================= HUD ================= */
let clockMin=0;
const toMin=s=>{const[h,m]=s.split(':').map(Number);let v=h*60+m-22*60;if(v<0)v+=1440;return v};
const fmt=v=>{let m=(22*60+v)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function setClock(c){
  const el=$('#clk'),sm=$('#clkS');
  if(c==='--:--'){el.textContent='--:--';sm.textContent='פלאשבק';document.body.classList.add('blind');return}
  document.body.classList.remove('blind');
  const target=toMin(c),from=clockMin,st=performance.now(),dur=from===target?1:1100;
  (function step(now){const k=Math.min(1,(now-st)/dur),e=1-Math.pow(1-k,3),v=Math.round(from+(target-from)*e);el.textContent=fmt(v);if(k<1)requestAnimationFrame(step);else clockMin=target})(st);
  const left=600-target, h=Math.floor(left/60), m=left%60;
  sm.textContent=left<=0?'זמן השיעור':'עוד '+(h?h+' שע׳ ':'')+(m?m+' דק׳ ':'')+'לשיעור';
  const dawn=target>=600?1:Math.max(0,(target-450)/150)*.75;
  document.documentElement.style.setProperty('--dawn',dawn.toFixed(2));
}
const CH=['פתיחה','המסע העיוור','ערימת החומר','בניית הציר','סולם רמות הלמידה','7 מטרות לתיקון','המטרות שלי','סיום'];
function setLoc(ch){
  $('#locN').textContent=ch>=1&&ch<=6?`פרק ${ch} מתוך 6`:'הלומדה הושלמה';
  $('#locT').textContent=CH[ch];
  $('#dots').innerHTML=[1,2,3,4,5,6].map(n=>`<i class="${n<ch?'d':n===ch?'c':''}"></i>`).join('');
  $('#prog').style.width=(Math.min(ch,7)/7*100)+'%';
}

/* ================= Noy ================= */
function noy(pose,text){
  return `<aside class="noy-col"><div class="bubble pop" id="nb">${t(text)}</div><img class="fig" id="nf" data-p="${pose}" src="${IMG[P[pose]]}" alt="סרן נוי"><div class="np"><b>סרן נוי</b>קצינת הדרכה חטיבתית</div></aside>`;
}
const FN=document.createElement('div');FN.className='fnoy';FN.setAttribute('role','status');
FN.innerHTML='<span class="x" aria-hidden="true">×</span><img alt="סרן נוי"><div class="bubble"></div>';
document.body.appendChild(FN);
let fnT;FN.onclick=()=>FN.classList.remove('show');
function floatNoy(pose,html){
  const nb=$('#nb');if(!nb)return;
  const r=nb.getBoundingClientRect(),top=$('#hud').getBoundingClientRect().bottom;
  if(r.top>=top&&r.bottom<=innerHeight-8){FN.classList.remove('show');return}
  $('img',FN).src=IMG[P[pose]];$('.bubble',FN).innerHTML=html;
  FN.classList.remove('show');void FN.offsetWidth;FN.classList.add('show');
  clearTimeout(fnT);fnT=setTimeout(()=>FN.classList.remove('show'),7000);
}
function say(pose,text){
  const b=$('#nb'),f=$('#nf');if(!b)return;
  b.classList.remove('pop');void b.offsetWidth;b.innerHTML=t(text);b.classList.add('pop');
  if(f.dataset.p!==pose){f.classList.add('swap');setTimeout(()=>{f.src=IMG[P[pose]];f.dataset.p=pose;f.classList.remove('swap')},150)}
  floatNoy(pose,b.innerHTML);
}

/* ================= question helper ================= */
function ask(container,{q,opts,correct,onOk,onBad,okText,badText,keepScore=true}){
  const order=shuffle(opts.map((o,i)=>i));
  container.innerHTML=`${q?`<div class="q">${t(q)}</div>`:''}<div class="opts">${order.map((oi,k)=>`<button class="opt" data-i="${oi}"><i>${ABC[k]}</i><span>${t(opts[oi])}</span></button>`).join('')}</div><div class="fbx"></div>`;
  let first=true;
  $$('.opt',container).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i===correct){
      b.classList.add('ok');$$('.opt',container).forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});
      if(keepScore)score(first);
      if(okText)$('.fbx',container).innerHTML=`<div class="fb fade">${t(okText)}</div>`;
      onOk&&onOk(first);
    }else{
      first=false;b.classList.add('bad');b.disabled=true;
      if(badText)$('.fbx',container).innerHTML=`<div class="fb bad fade">${t(typeof badText==='function'?badText(i):badText)}</div>`;
      onBad&&onBad(i);
    }
  });
}

/* ================= scene engine ================= */
const scenes=[];
function scene(def){scenes.push(def)}
function go(i){
  S.i=i;if(i>0)save();qn=0;
  const sc=scenes[i];
  document.body.classList.toggle('intro',sc.ch===0);
  if(sc.clock)setClock(sc.clock);
  setLoc(sc.ch);
  $('#back').disabled=i<1;
  FN.classList.remove('show');
  const st=$('#stage');st.innerHTML='';
  $$('.march,.fog,.mp-wrap,.moon,.horizon,.bridge').forEach(e=>e.remove());
  const el=document.createElement('section');el.className='scene';st.appendChild(el);
  window.scrollTo({top:0,behavior:'instant'});
  sc.render(el,()=>advance(i));
}
$('#back').onclick=()=>{if(S.i>0)go(S.i-1)};

function advance(i){

  const fold=endCh&&FOLDER[ch]?`<div class="st d"><i>📁</i><div><small>נוסף לתיק השיעור</small><p>${FOLDER[ch]}</p></div></div><div class="sep"></div>`:'';
  const ov=document.createElement('div');ov.className='bridge';
  ov.innerHTML=`<div class="bx"><div class="bh">${CH[ch]} · סיכום ביניים</div>
    <div class="st d"><i>✓</i><div><small>מה עשינו</small><p>${t(b[0])}</p></div></div>
    <div class="sep"></div>${fold}
    <div class="st n"><i>←</i><div><small>מה עכשיו</small><p>${t(b[1])}</p></div></div>
    <button class="btn">ממשיכים ←</button></div>`;

  $('.btn',ov).onclick=()=>{ov.remove();go(i+1)};
}

const VL=[
 ['ימנה','ישנן','ינסח','יבטא','ירחיב','יפתור','יסביר','ייתן','יגיב','יכלול','יגדיר','יטען','יפרט','יציג','יתאר'],
 ['יפעיל','יכין','יבצע','יארגן','ירכיב','ירכב','ימדוד','יאסוף','ינהג','יכוון','יפוצץ','יחבוש','יתקין','יתפעל','יפרוק','יפרק','יתחזק','יטפל','ינקה','ירוץ','יירה','יטפס','יפרוץ','יכתוב','יבנה'],
 ['ינתח','ימיין','יקטלג','יסיק','יתעדף','יחקור','יאמת','ישקול','ידרג','יבקר','ישווה','יעריך'],
 ['ייצור','יחולל','ישכלל','ישלב','יכווין','יעצב','יתכנן','יפתח','יפיק','יתווה','ימשיג']];
const BADV={obs:['יבין','ילמד','יכיר','ידע','יזכור','יפנים','יתוודע'],proc:['יתרגל','יתאמן','ישתתף','יעבור']};
const norm=w=>w.replace(/[״"׳']/g,'').replace(/^ה?(ת)(?=[א-ת]{2,})/,'י');
function verbLevel(v){for(let i=3;i>=0;i--)if(VL[i].includes(v))return i;return -1}
function analyze(s){
  const txt=(s||'').trim();if(txt.length<6)return null;
  const words=txt.split(/\s+/);const subj=words[0].replace(/[״"]/g,'');
  const R=[];
  const learner=/^(החניך|החניכה|החניכים|החניכות|הצוער|הצוערת|הצוערים|הלומד|הלומדת|הלומדים|המשתלם|המשתלמת)$/.test(subj);
  R.push(learner?['y','ביצוע של הלומד']:['n','מי מבצע? {פתח|פתחי} ב"החניך…"']);
  const all=words.map(norm);
  if(all.some(w=>BADV.obs.includes(w)))R.push(['n','לא ניתן לתצפית (יבין/ילמד/יכיר…)']);else R.push(['y','ניתן לתצפית']);
  if(all.some(w=>BADV.proc.includes(w)))R.push(['n','תהליך ולא תוצר ("יתרגל"…)']);else R.push(['y','תוצר למידה']);
  if(/(היטב|טוב מאוד|בצורה טובה|כראוי|כמו שצריך)/.test(txt))R.push(['n','מדד איכותי לא ברור ("היטב"…)']);
  const multi=words.slice(2).some(w=>/^ו/.test(w)&&verbLevel(norm(w.slice(1)))>=0);
  R.push(multi?['n','יותר מפעולה אחת – {פצל|פצלי} לשתי מטרות']:['y','חד־משמעית']);
  const measured=/\d/.test(txt)||/(ע["״]?פ|עפ["״]?י|על[- ]פי|לפי|בהתאם|תוך|בתוך|ללא שגיאות|בדיוק)/.test(txt);
  R.push(measured?['y','יש מדד']:['w','כדאי להוסיף מדד כמותי או איכותי']);
  return {R,ok:R.every(r=>r[0]!=='n')};
}

  $$('.topics .chip',el).forEach(c=>c.onclick=()=>{S.topic=c.dataset.t;$$('.topics .chip',el).forEach(x=>x.classList.toggle('ok',x===c));save();
    if(S.topic==='נושא אחר שלי')say('think','נושא משלך? מצוין. {תחשוב|תחשבי} קודם: מה החניך צריך לעשות <b>בשטח</b>?');else say('explain','בחירה טובה.<br>{תתחיל|תתחילי} מהסוף: עם מה החניך <b>יוצא</b> מהשיעור?');check()});
  let lastSay=0;
  const check=()=>{
    const v=[0,1,2,3].map(i=>$('#f'+i,el).value);
    S.goals={top:v[0],m:v.slice(1)};save();
    const A=v.map(analyze);
    A.forEach((a,i)=>{$('#c'+i,el).innerHTML=a?a.R.map(r=>`<span class="${r[0]}">${r[0]==='y'?'✓':r[0]==='n'?'✗':'!'} ${t(r[1])}</span>`).join(''):''});
    const mids=A.slice(1).filter(Boolean),top=A[0];
    const manual=[1,2,3,4].every(i=>$('#m'+i,el).checked);
    const okAll=top&&top.ok&&mids.length>=2&&mids.every(m=>m.ok)&&!!S.topic;
    $('#nx',el).disabled=!(okAll&&manual);
    $('#st',el).textContent=t(!S.topic?'{בחר|בחרי} נושא לשיעור':!top?'{כתוב|כתבי} מטרת על':mids.length<2?'נדרשות לפחות 2 מטרות ביניים':!okAll?'יש עוד מה לתקן – {הסתכל|הסתכלי} על הסימונים האדומים':!manual?'נשארה הבדיקה העצמית':'התיק מוכן להגשה');
    const now=Date.now();
    if(now-lastSay>2500&&document.activeElement&&document.activeElement.tagName!=='TEXTAREA'){
      const bad=A.find(a=>a&&!a.ok);
      if(bad){say('point','רגע… {תסתכל|תסתכלי} על הסימונים האדומים. <b>כל ✗ הוא כלל מכתב אחר״ת.</b>');lastSay=now}
      else if(okAll&&!manual){say('think','הניסוח נקי. נשאר רק מה שאני לא יכולה לבדוק בשבילך – <b>הבדיקה העצמית</b>.');lastSay=now}
      else if(okAll&&manual){say('thumbs','<b>זהו.</b> התיק מוכן להגשה.');lastSay=now}
    }
  };
  $$('textarea',el).forEach(x=>{x.addEventListener('input',check);x.addEventListener('blur',()=>{lastSay=0;check()})});
  $$('input',el).forEach(x=>x.addEventListener('change',()=>{lastSay=0;check()}));
  check();
  $('#nx',el).onclick=next;
}});

/* ================= gender pass over any inserted text ================= */
const GRX=/\{([^|{}]*)\|([^|{}]*)\}/;
function fixTree(root){
  if(root.nodeType===3){if(GRX.test(root.nodeValue))root.nodeValue=t(root.nodeValue);return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const L=[];
  while(n=w.nextNode())if(GRX.test(n.nodeValue))L.push(n);
  L.forEach(n=>n.nodeValue=t(n.nodeValue));
  $$('[placeholder]',root).forEach(e=>{if(GRX.test(e.placeholder))e.placeholder=t(e.placeholder)});
  $$('[data-r]',root).forEach(e=>{if(GRX.test(e.dataset.r))e.dataset.r=t(e.dataset.r)});
}
new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(fixTree);if(m.type==='characterData')fixTree(m.target)})).observe(document.body,{childList:true,subtree:true,characterData:true});
